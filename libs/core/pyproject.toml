[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "pypdf>=5.1",
    "anthropic>=0.116",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
