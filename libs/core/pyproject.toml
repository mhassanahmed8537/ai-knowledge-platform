[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "pypdf>=6.15",  # CVE-2026-71870 / CVE-2026-71852: DoS parsing malicious uploaded PDFs
    "anthropic>=0.116",
    "langgraph>=0.2",
]

[dependency-groups]
# Mirrors the root workspace's `migrate` group so the migration Job image
# (infra/docker/migrate.Dockerfile) can target this package directly:
# `uv sync --package core --only-group migrate` needs the group declared in
# *this* file — uv resolves --package's groups against that package's own
# pyproject.toml, not the workspace root's.
migrate = [
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
