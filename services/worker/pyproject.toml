[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "core",
    "celery[redis]>=5.4",
    "httpx>=0.27",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
