[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
