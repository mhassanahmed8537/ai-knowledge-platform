apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: knowledge-platform-dev

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: replica-patch.yaml
  - path: hpa-patch.yaml
  - path: configmap-patch.yaml
  - path: ingress-patch.yaml

images:
  - name: ghcr.io/mhassanahmed8537/ai-knowledge-platform-api
    newTag: dev
  - name: ghcr.io/mhassanahmed8537/ai-knowledge-platform-worker
    newTag: dev
  - name: ghcr.io/mhassanahmed8537/ai-knowledge-platform-migrate
    newTag: dev

labels:
  - pairs:
      environment: dev
