# Not wired into a Deployment's rollout automatically — kustomize has no
# native "run this Job and wait before the Deployment rolls" primitive
# without a tool like Helm hooks or Argo Rollouts. Apply/wait on this
# explicitly as a pre-deploy step:
#
#   kubectl apply -f <(kubectl kustomize infra/k8s/overlays/dev | \
#     yq 'select(.kind == "Job")')
#   kubectl wait --for=condition=complete job/db-migrate --timeout=120s
#   kubectl apply -k infra/k8s/overlays/dev
#
# generateName + a fresh apply per deploy avoids "Job is immutable" errors
# on redeploy; ttlSecondsAfterFinished cleans up old ones automatically.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: db-migrate-
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: ai-knowledge-platform
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Digest-pinning needs CI to publish real images first -- see infra/k8s/README.md"
    checkov.io/skip2: "CKV_K8S_35=core.config.Settings reads from the environment (pydantic-settings) -- see infra/k8s/README.md"
    # This Job is applied standalone (see the header comment above), not
    # through kustomize -- update the tag by hand (or `kubectl set image`)
    # before applying each deploy, same caveat as CKV_K8S_43 above.
    checkov.io/skip3: "CKV_K8S_14=Applied standalone, not through kustomize's images: transformer -- update the tag before applying, see infra/k8s/README.md"
    # Namespace and NetworkPolicy coverage are real in the actual apply flow
    # (kubectl apply -f ... -n <namespace>, and networkpolicy.yaml's
    # db-migrate-allow policy is applied via the same overlay) -- scanning
    # this file in isolation just can't see either.
    checkov.io/skip4: "CKV_K8S_21=Namespace is supplied via -n at apply time, see the header comment above"
    checkov.io/skip5: "CKV2_K8S_6=networkpolicy.yaml's db-migrate-allow covers this pod in the real apply flow"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: ai-knowledge-platform
    spec:
      restartPolicy: Never
      serviceAccountName: db-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/mhassanahmed8537/ai-knowledge-platform-migrate:latest
          imagePullPolicy: Always
          # Only the migration role's credential -- see the secret.example.yaml
          # note; MIGRATION_DATABASE_URL is the *superuser* connection string,
          # deliberately not part of app-secrets (api/worker never see it).
          envFrom:
            - secretRef:
                name: db-migrate-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
