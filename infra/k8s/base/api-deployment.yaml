apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-knowledge-platform
  annotations:
    checkov.io/skip1: "CKV_K8S_43=Digest-pinning needs CI to publish real images first -- see infra/k8s/README.md"
    checkov.io/skip2: "CKV_K8S_35=core.config.Settings reads from the environment (pydantic-settings); file-mounted secrets need a broader config-loading change -- see infra/k8s/README.md"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: ai-knowledge-platform
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node loss doesn't take the
      # whole api tier down; "ScheduleAnyway" so it degrades to best-effort
      # on small (e.g. dev/kind) clusters instead of leaving pods Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      # Explicit at both levels: the ServiceAccount already sets this (see
      # serviceaccounts.yaml), but a Pod spec can override that default, so
      # static scanners (and future editors) shouldn't have to trace back to
      # the ServiceAccount to confirm it.
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/mhassanahmed8537/ai-knowledge-platform-api:latest
          # Always, not IfNotPresent: images are tag-pinned (:dev, :<git-sha>
          # once CI publishes them — see .github/workflows/ci.yml) rather than
          # digest-pinned, so a stale node-local cache under the same tag is a
          # real risk IfNotPresent would silently accept.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Starlette spools multipart uploads (PDF ingestion) to disk via
          # SpooledTemporaryFile once past its in-memory threshold, and the
          # container root is read-only, so /tmp needs its own writable
          # volume rather than falling back to the (denied) root fs.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-knowledge-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-knowledge-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
