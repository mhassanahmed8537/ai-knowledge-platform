# Separate identities for api and worker so their IAM policies (IRSA — see
# infra/terraform/modules/eks) can be scoped independently: api never needs
# S3 write access to the documents bucket beyond what it already proxies
# through presigned flows, worker needs S3 read/write + Bedrock/embedding
# provider egress. The role-arn annotations are placeholders filled in per
# environment by the overlay (see overlays/dev/kustomization.yaml) or by the
# Terraform/kubectl glue that wires IRSA role ARNs from `terraform output`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ai-knowledge-platform
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_API_IRSA_ROLE_ARN"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: ai-knowledge-platform
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_WORKER_IRSA_ROLE_ARN"
automountServiceAccountToken: false
---
# Distinct from api/worker: this identity's IAM policy (and its
# MIGRATION_DATABASE_URL credential) has DDL rights on the database that
# api/worker must never hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: ai-knowledge-platform
automountServiceAccountToken: false
