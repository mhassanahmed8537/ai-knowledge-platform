# NOT applied by kustomization.yaml (deliberately absent from `resources:`) —
# this documents the keys api/worker expect in a Secret named `app-secrets`,
# for whoever wires up the real one. In a real cluster that Secret is created
# by the External Secrets Operator pulling from AWS Secrets Manager (populated
# by infra/terraform/modules/database's random_password + aws_secretsmanager_secret),
# never committed to git. For a bare-bones cluster without ESO, create it once
# with:
#
#   kubectl create secret generic app-secrets -n <namespace> \
#     --from-literal=DATABASE_URL=... \
#     --from-literal=AUTH_DATABASE_URL=... \
#     --from-literal=REDIS_URL=... \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=S3_ACCESS_KEY=... \
#     --from-literal=S3_SECRET_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=GEMINI_API_KEY=...
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # infra/terraform/modules/database sets rds.force_ssl=1, so these need
  # ?ssl=require (asyncpg honours the "ssl" query param) or RDS will reject
  # the connection outright. Not needed against local docker-compose Postgres.
  DATABASE_URL: "postgresql+asyncpg://REPLACE/REPLACE?ssl=require"
  AUTH_DATABASE_URL: "postgresql+asyncpg://REPLACE/REPLACE?ssl=require"
  REDIS_URL: "redis://REPLACE"
  JWT_SECRET: "REPLACE-with-openssl-rand--hex-32"
  SESSION_SECRET: "REPLACE-with-openssl-rand--hex-32"
  S3_ACCESS_KEY: "REPLACE"
  S3_SECRET_KEY: "REPLACE"
  ANTHROPIC_API_KEY: "REPLACE"
  OPENAI_API_KEY: "REPLACE"
  GEMINI_API_KEY: "REPLACE"
---
# Consumed only by the migration Job (infra/k8s/base/migration-job.yaml).
# Holds the *superuser* connection string -- api/worker's app-secrets above
# must never carry this credential.
apiVersion: v1
kind: Secret
metadata:
  name: db-migrate-secret
type: Opaque
stringData:
  MIGRATION_DATABASE_URL: "postgresql+asyncpg://REPLACE-superuser/REPLACE?ssl=require"
  # Consumed by scripts/prepare_db.py to set app_user/app_auth's passwords
  # (see the module's outputs: app_user_secret_arn / app_auth_secret_arn).
  APP_USER_PASSWORD: "REPLACE-from-terraform-output-app_user_secret_arn"
  APP_AUTH_PASSWORD: "REPLACE-from-terraform-output-app_auth_secret_arn"
